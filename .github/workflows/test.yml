name: test

on:
  push:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'LICENSE'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
      -
        name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install gcc make lcov -y
      -
        name: Run Tests (AddressSanitizer)
        run: make test
      -
        name: Generate Coverage Report
        run: make coverage
      -
        name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: unittests
          disable_search: true
          files: coverage/coverage.info
